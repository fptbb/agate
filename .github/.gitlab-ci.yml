spec:
    inputs:
        force_build:
            type: boolean
            default: false
            description: "forces pipeline to build images regardless of update checks"
        simulate_schedule:
            type: boolean
            default: false
            description: "simulates a scheduled pipeline run to test update logic"
---
workflow:
    rules:
        - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
          when: never
        - if: "$CI_COMMIT_TAG"
        - if: '$CI_PIPELINE_SOURCE == "schedule" || $SIMULATE_SCHEDULE == "true"'
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
          changes:
              paths:
                  - files/**/*
                  - modules/**/*
                  - recipes/**/*
                  - .github/ci/**/*
                  - .github/**/*
                  - .gitlab-ci.yml
                  - Justfile
                  - README.md
                  - LICENSE
                  - artifacthub-repo.yml
                  - artifacthub-repo-gh.yml
                  - cosign.pub
        - if: "$CI_COMMIT_BRANCH"
          changes:
              paths:
                  - files/**/*
                  - modules/**/*
                  - recipes/**/*
                  - .github/ci/**/*
                  - .github/**/*
                  - .gitlab-ci.yml
                  - Justfile
                  - README.md
                  - LICENSE
                  - artifacthub-repo.yml
                  - artifacthub-repo-gh.yml
                  - cosign.pub
        # daily builds
        - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
          when: never

default:
    artifacts:
        expire_in: 1 day

variables:
    IMAGE_NAME: "agate"
    UPSTREAM_IMAGE: "ublue-os/bazzite-nvidia-open"
    UPSTREAM_REGISTRY: "ghcr.io"
    # Manual override. Deliberately a different name from FORCE_BUILD so it does
    # not shadow the value written to build.env by check-update; each gate ORs
    # the two together.
    FORCE_BUILD_INPUT: "$[[ inputs.force_build ]]"
    SIMULATE_SCHEDULE: "$[[ inputs.simulate_schedule ]]"


.python-job:
    image: python:3-alpine
    before_script:
        - pip install requests
        - export PYTHONPATH="$CI_PROJECT_DIR/.github"

stages:
    - check
    - build
    - publish
    - deploy
    - cleanup

check-update:
    image: fedora:latest
    stage: check
    rules:
        - if: '$CI_PIPELINE_SOURCE == "schedule" || $SIMULATE_SCHEDULE == "true"'
    artifacts:
        expire_in: 1 day
        reports:
            dotenv: build.env
    before_script:
        - dnf install -y python3 python3-requests python3-pyyaml
        - export PYTHONPATH="$CI_PROJECT_DIR/.github"
    script:
        - python3 -m ci.gitlab.check_update
        - python3 -m ci.gitlab.check_package_updates

build-image:
    stage: build
    needs:
        - job: check-update
          artifacts: true
          optional: true
    rules:
        - when: on_success
    tags:
        - saas-linux-2xlarge-amd64
    image:
        name: ghcr.io/blue-build/cli
        entrypoint: [""]
    services:
        - docker:dind
    parallel:
        matrix:
            - RECIPE:
                  - recipe.yml
    variables:
        DOCKER_HOST: tcp://docker:2376
        DOCKER_TLS_CERTDIR: /certs
        DOCKER_TLS_VERIFY: "1"
        DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"

    before_script:
        # Initialize force-build state, preserving update-check results
        - |
            export FORCE_BUILD="${FORCE_BUILD:-false}"

            if [ "${FORCE_BUILD_INPUT:-false}" = "true" ]; then
              export FORCE_BUILD=true
            fi

            if [ "$CI_PIPELINE_SOURCE" = "schedule" ] || \
               [ "${SIMULATE_SCHEDULE:-false}" = "true" ]; then
              if [ "$FORCE_BUILD" != "true" ]; then
                echo "No update found. Skipping build."
                exit 0
              fi
            fi

        # Authenticate with the container registry
        - |
            : "${BB_REGISTRY:?Missing BB_REGISTRY}"
            : "${BB_USERNAME:?Missing BB_USERNAME}"
            : "${BB_PASSWORD:?Missing BB_PASSWORD}"

            printf '%s' "$BB_PASSWORD" |
              docker login "$BB_REGISTRY" \
                --username "$BB_USERNAME" \
                --password-stdin

    script:
        # Restore Cosign keys from GitLab CI variables
        - |
            set -eu

            : "${COSIGN_PUBLIC_KEY:?Missing COSIGN_PUBLIC_KEY}"
            : "${COSIGN_PRIVATE_KEY:?Missing COSIGN_PRIVATE_KEY}"

            # Public key: supports regular and file-type variables
            if [ -f "$COSIGN_PUBLIC_KEY" ]; then
              cp "$COSIGN_PUBLIC_KEY" ./cosign.pub
            else
              printf '%s\n' "$COSIGN_PUBLIC_KEY" > ./cosign.pub
            fi

            # Private key: supports regular and file-type variables
            case "$COSIGN_PRIVATE_KEY" in
              /*)
                if [ -f "$COSIGN_PRIVATE_KEY" ]; then
                  COSIGN_PRIVATE_KEY="$(cat "$COSIGN_PRIVATE_KEY")"
                  export COSIGN_PRIVATE_KEY
                fi
                ;;
            esac

            # Verify the public key exists and has a PEM header
            test -s ./cosign.pub
            grep -q -- '^-----BEGIN PUBLIC KEY-----' ./cosign.pub

            echo "Cosign signing keys configured."

        # Allow Docker-in-Docker additional startup time
        - sleep 5

        # Build and push the image
        - |
            echo "Pushing to $BB_REGISTRY/$BB_REGISTRY_NAMESPACE/$IMAGE_NAME"

            BLUEBUILD_CACHE_FLAG=""

            if [ "${FORCE_BUILD:-false}" != "true" ]; then
              BLUEBUILD_CACHE_FLAG="--cache-layers"
            else
              echo "FORCE_BUILD=true; rebuilding without layer cache."
            fi

            bluebuild build \
              --verbose \
              $BLUEBUILD_CACHE_FLAG \
              --compression-format zstd \
              --push \
              "./recipes/$RECIPE"


publish-metadata:
    stage: publish
    image: alpine:latest
    variables:
        REGCTL_VERSION: v0.5.0
        DEST_REPO: "$BB_REGISTRY/$BB_REGISTRY_NAMESPACE/$IMAGE_NAME:artifacthub.io"
    needs:
        - job: check-update
          artifacts: true
          optional: true
        - job: build-image
    rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
        - if: $CI_COMMIT_TAG
    before_script:
        # skips publish on scheduled or simulated pipelines if no update is found
        - |
            if [ "${FORCE_BUILD_INPUT}" = "true" ]; then FORCE_BUILD=true; fi
            if [ "$CI_PIPELINE_SOURCE" = "schedule" ] || [ "$SIMULATE_SCHEDULE" = "true" ]; then
              if [ "$FORCE_BUILD" != "true" ]; then
                echo "No update found. Skipping publish."
                exit 0
              fi
            fi
        - apk add --no-cache curl
        - curl -L https://github.com/regclient/regclient/releases/download/${REGCTL_VERSION}/regctl-linux-amd64 > /usr/local/bin/regctl
        - chmod +x /usr/local/bin/regctl
        - echo "$BB_PASSWORD" | regctl registry login $BB_REGISTRY -u "$BB_USERNAME" --pass-stdin
    script:
        - |
            if [ ! -f "artifacthub-repo.yml" ]; then
              echo "Error: artifacthub-repo.yml not found in repository root."
              exit 1
            fi
        - |
            regctl artifact put \
              --format '{{ .Manifest.GetDescriptor.Digest }}' \
              --artifact-type application/vnd.cncf.artifacthub.config.v1+yaml \
              -f artifacthub-repo.yml \
              --file-media-type "application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml" \
              $DEST_REPO

pages:
    stage: deploy
    image: python:3-alpine
    rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    before_script:
        - apk add --no-cache git
        - export PYTHONPATH="$CI_PROJECT_DIR/.github"
    script:
        - python3 -m ci.gitlab.build_pages
    artifacts:
        paths:
            - public
        expire_in: 1 week

cleanup-old-tags:
    extends: .python-job
    stage: cleanup
    needs:
        - job: check-update
          artifacts: true
          optional: true
        - job: build-image
    rules:
        - when: on_success
    variables:
        MAX_AGE_DAYS: "7"
        MAX_KEEP: "5"
        DRY_RUN: "false"
    script:
        # skips cleanup on scheduled or simulated pipelines if no update is found
        - |
            if [ "${FORCE_BUILD_INPUT}" = "true" ]; then FORCE_BUILD=true; fi
            if [ "$CI_PIPELINE_SOURCE" = "schedule" ] || [ "$SIMULATE_SCHEDULE" = "true" ]; then
              if [ "$FORCE_BUILD" != "true" ]; then
                echo "No update found. Skipping cleanup."
                exit 0
              fi
            fi
        - python3 -m ci.gitlab.cleanup_old_tags
