name: bluebuild
on:
  schedule:
    - cron: "*/30 * * * *" # build every 30 minutes
  push:
  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  IMAGE_NAME: "agate"
  REGISTRY: "ghcr.io"

jobs:
  check-update:
    name: Check for updates
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      needs-update: ${{ steps.check.outputs.needs_update }}
      recipes: ${{ steps.check.outputs.recipes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check if update is needed
        id: check
        shell: bash
        env:
          UPSTREAM_IMAGE: "ublue-os/bazzite-nvidia-open"
          UPSTREAM_REGISTRY: "ghcr.io"
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          REGISTRY: ${{ env.REGISTRY }}
          USERNAME: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}/.github
        run: |
          pip install requests
          python3 -m ci.github.check_update

  bluebuild:
    name: Build Custom Image
    needs: check-update
    # Only build on push/manual (which skips check-update), OR if check-update explicitly outputs true.
    # use always() to ensure it runs even if check-update is skipped.
    if: |
      always() &&
      (needs.check-update.result == 'skipped' || (needs.check-update.outputs.needs-update == 'true' && needs.check-update.outputs.recipes != '[]'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJson(needs.check-update.outputs.recipes || '["recipe.yml", "recipe-testing.yml"]') }}


    steps:
      - name: Maximize build space
        uses: ublue-os/container-storage-action@main

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Prepare and validate Cosign keys
        shell: bash
        env:
            COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
            COSIGN_PUBLIC_KEY: ${{ vars.COSIGN_PUBLIC_KEY }}
            COSIGN_PASSWORD: ""
        run: |
            set -euo pipefail
            umask 077

            : "${COSIGN_PRIVATE_KEY:?Missing private key}"
            : "${COSIGN_PUBLIC_KEY:?Missing public key}"

            # Generate the public key directly from the private key
            cosign public-key \
                --key env://COSIGN_PRIVATE_KEY \
                > cosign.pub

            # Write configured public key for comparison
            printf '%s\n' "$COSIGN_PUBLIC_KEY" \
                > "$RUNNER_TEMP/configured.pub"

            # Convert both public keys to canonical DER
            openssl pkey -pubin \
                -in cosign.pub \
                -outform DER \
                -out "$RUNNER_TEMP/derived.der"

            openssl pkey -pubin \
                -in "$RUNNER_TEMP/configured.pub" \
                -outform DER \
                -out "$RUNNER_TEMP/configured.der"

            # Compare actual cryptographic key data
            if ! cmp -s \
                "$RUNNER_TEMP/derived.der" \
                "$RUNNER_TEMP/configured.der"; then
                echo "ERROR: GitHub private and public keys differ."
                echo "Public-key fingerprints:"
                sha256sum \
                "$RUNNER_TEMP/derived.der" \
                "$RUNNER_TEMP/configured.der"
                exit 1
            fi

            echo "Cosign key pair validated successfully."

      - name: Build Custom Image
        uses: blue-build/github-action@v1.14.0
        with:
            recipe: ${{ matrix.recipe }}
            cosign_private_key: ${{ secrets.COSIGN_PRIVATE_KEY }}
            registry_token: ${{ github.token }}
            pr_event_number: ${{ github.event.number }}
            cli_version: v0.9.42
            build_opts: --build-driver=podman --run-driver=podman
            use_cache: true
            maximize_build_space: false
            skip_checkout: true


  cleanup-old-tags:
    name: Cleanup old tags
    runs-on: ubuntu-latest
    needs: bluebuild
    if: always() # Run even if bluebuild fails or is skipped
    permissions:
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cleanup old tags
        shell: bash
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          USERNAME: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_AGE_DAYS: "7"
          MAX_KEEP: "5"
          PYTHONPATH: ${{ github.workspace }}/.github
        run: |
          pip install requests
          python3 -m ci.github.cleanup_old_tags
