# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    repos:
      cleanup: true
      copr:
        # Dux Shell development build and its companion packages.
        - duxlabs/dms
        # Dux Labs packages (Quickshell, Dux Search, etc.).
        - duxlabs/dux-repo
    install:
      packages:
        - niri
        - xwayland-satellite
        - dms
        - alacritty
        - dux-search
        - dux-calendar
        - dux-files
        - cava
        - cliphist
        - wl-clipboard
        - dgop
        - danksearch
        - matugen
        - khal

        # Dux Files optional integrations: removable/network storage,
        # sandboxed thumbnailers, and PDF thumbnails.
        - gvfs
        - udisks2
        - bubblewrap
        - poppler-utils

        # System / desktop integration
        - adw-gtk3-theme
        - qt6-qtmultimedia
        - cups-pk-helper
        - kf6-kwallet
        - pam-kwallet
        - kwalletmanager
        # - qt5ct
        - qt6ct
        - kvantum
        - xdg-desktop-portal-gtk
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-kde
        - xdg-desktop-portal-wlr

  - type: script
    scripts:
      - duxshell.sh
