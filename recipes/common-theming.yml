---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode
        - FiraMono
  - type: justfiles
    validate: true
    include:
      - themes.just
  - type: script
    no-cache: true
    scripts:
      - theming.sh