---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: agate
description: A custom image of Bazzite for personal needs.

base-image: ghcr.io/ublue-os/bazzite-nvidia-open
image-version: testing
alt-tags:
  - testing

modules:
  # Unlock KDE and QT packages to allow for newer versions than the base image provides.
  - type: script
    snippets:
      - |
        set -euo pipefail

        echo "=== Removing KDE and Qt 6 version locks ==="

        python3 - <<'PY'
        from pathlib import Path
        import re

        path = Path("/etc/dnf/versionlock.toml")
        content = path.read_text()

        sections = re.split(
            r"(?=^\[\[packages\]\][ \t]*$)",
            content,
            flags=re.MULTILINE,
        )

        kept = [sections[0]]
        removed = []

        for section in sections[1:]:
            match = re.search(
                r'^name\s*=\s*"([^"]+)"',
                section,
                flags=re.MULTILINE,
            )
            if not match:
                raise ValueError("Unrecognized versionlock entry")

            name = match.group(1)

            if name.startswith(("plasma-", "qt6-")):
                removed.append(name)
            else:
                kept.append(section)

        path.write_text("".join(kept))
        print(f"Removed {len(removed)} KDE/Qt version locks")
        PY

        echo "=== Verifying remaining KDE locks ==="
        if dnf5 versionlock list | grep -E '^Package name: (plasma-|qt6-)'; then
          echo "ERROR: KDE/Qt version locks remain"
          exit 1
        fi

        echo "=== Upgrading KDE Plasma ==="
        dnf5 -y --refresh --best upgrade \
          'plasma-*' \
          'qt6-*' \
          'kf6-*' \
          'kwin*' \
          'libplasma*' \
          'kde-*'

        echo "=== Installed KDE versions ==="
        rpm -q plasma-desktop plasma-workspace kwin

  # Shared modules; see recipes/common-modules.yml
  - from-file: common-modules.yml

  # Branding channel
  - type: script
    env:
      AGATE_CHANNEL: testing
    scripts:
      - branding.sh

  # Obligatory Common Modules, do not remove. Must stay last.
  - from-file: common.yml

